name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: generate + typecheck + verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Everything here relies on Node's built-in TypeScript type-stripping
        # (no build step) -- 22.6.0 is when that landed, 24 is current LTS.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Regenerate, type-check, and cross-verify examples/pos-inventory-demo
        working-directory: examples/pos-inventory-demo
        run: npm run verify

      - name: Confirm the CLI wrapper produces the same result
        working-directory: examples/pos-inventory-demo
        run: npm run generate:cli

  packaging:
    name: package publish readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: npm publish --dry-run for every publishable package
        run: |
          set -e
          for pkg in generator-core plugin-jazz-schema plugin-ts-rest-contract plugin-betterauth-claims cli; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && npm publish --dry-run)
            echo "::endgroup::"
          done

      - name: Regression test -- cli must actually run from a real node_modules install
        # Node refuses to type-strip .ts files under node_modules (no flag
        # overrides it), which the plugins never hit (loaded via ZenStack's
        # jiti-based loader) but a `bin` entry does, since Node's own module
        # loader executes it directly. This exact bug shipped in 0.1.0 and
        # every earlier check here (workspace symlinks, --dry-run) missed it
        # -- see docs/plugin-api-notes.md. Guards against it regressing.
        run: |
          set -e
          mkdir -p /tmp/cli-smoketest
          (cd packages/cli && npm pack --pack-destination /tmp/cli-smoketest)
          cd /tmp/cli-smoketest
          npm init -y >/dev/null
          npm install ./schema-codegen-bridge-*.tgz
          set +e
          npx schema-codegen-bridge generate > out.log 2>&1
          if grep -q "ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING" out.log; then
            echo "::error::cli regressed: bin.ts is shipping as raw TypeScript again"
            cat out.log
            exit 1
          fi
          grep -q "Could not find a schema at" out.log || { echo "::error::unexpected output"; cat out.log; exit 1; }
          echo "OK: cli ran and failed for the expected reason (no schema in this scratch dir), not a type-stripping crash"
