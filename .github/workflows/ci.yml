name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: generate + typecheck + verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Everything here relies on Node's built-in TypeScript type-stripping
        # (no build step) -- 22.6.0 is when that landed, 24 is current LTS.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check source, regenerate examples, and run regression tests
        run: pnpm run verify

  packaging:
    name: package publish readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: npm pack --dry-run for every publishable package
        # Not `npm publish --dry-run`: now that these are genuinely published
        # (see PLAN.md M7), a dry-run *publish* correctly fails with "cannot
        # publish over previously published versions" for any already-shipped
        # version -- that's npm behaving correctly, not a bug, but it makes
        # `publish --dry-run` useless as an ongoing CI packaging check. `pack
        # --dry-run` validates the same thing (files/exports/tarball
        # contents) without hitting the registry's version check at all.
        run: |
          set -e
          for pkg in generator-core plugin-jazz-schema plugin-ts-rest-contract plugin-betterauth-claims cli; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && npm pack --dry-run)
            echo "::endgroup::"
          done

      - name: Regression test -- install every tarball and generate outside the workspace
        # This catches three classes of problem that workspace links and dry
        # runs cannot: workspace: ranges not rewritten, undeclared transitive
        # imports, and a raw TypeScript CLI bin (the bug shipped in 0.1.0).
        run: |
          set -e
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          mkdir -p "$smoke_dir/tarballs" "$smoke_dir/app/zenstack"
          for pkg in generator-core plugin-jazz-schema plugin-ts-rest-contract plugin-betterauth-claims cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$smoke_dir/tarballs")
          done
          cp examples/pos-inventory-demo/zenstack/schema.zmodel "$smoke_dir/app/zenstack/schema.zmodel"
          cd "$smoke_dir/app"
          npm init -y >/dev/null
          npm install "$smoke_dir"/tarballs/*.tgz @zenstackhq/plugin-policy@3.9.3
          npx schema-codegen-bridge generate -- --silent
          test -f generated/jazz-schema.ts
          test -f generated/ts-rest-contract.ts
          test -f generated/betterauth-claims.ts
